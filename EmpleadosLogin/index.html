<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyería Elegance - Login</title>
  <link rel="stylesheet" href="./css/styles-header.css">
  <link rel="stylesheet" href="./css/styles-footer.css">
  <link rel="stylesheet" href="./css/styles-login.css">
  <script src="./scripts/login.js"></script>
</head>

<body>
      <!-- ===== HEADER ===== -->
  <header>
    <div class="header-left">
        <a href="gestionPedidos.html"><i class="fa-solid fa-arrow-up-wide-short"></i></a>
    </div>

    <!-- Logo en el centro -->
    <div class="header-center">
        <a href="index.html"><img src="./images/Logo.png" alt="Joyería Logo" class="logo"></a>
    </div>

    <!-- Carrito a la derecha -->
    <div class="header-right">
        <a href="index.html"><i class="fas fa-user"></i></a>
    </div>
  </header>

  <!-- ===== LOGIN ===== -->
  <main class="login">
    <div id="loaderPost" class="loader">
      <div class="spinner"></div>
    </div>
    <h1>Inicio de sesión</h1>

    <!-- Datos del cliente -->
    <section class="login-form">
      <h2>Ingrese sus datos:</h2>
      <form id="form-login" action="index.html">
        <section class="login-user-password">
          <label>Usuario</label>
          <input name="usuario" type="text" required>

          <label>Contraseña</label>
          <input name="contraseña" type="password" required>
        </section>

        <button id="btn-login" type="submit">Iniciar Sesión</button>
      </form>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="footer-info">
      <div class="contact">
        <h4>Contacto</h4>
        <p>Tel: +57 300 123 4567</p>
        <p>Email: contacto@joyeriaelegance.com</p>
      </div>
      <div class="schedule">
        <h4>Horario</h4>
        <p>Lunes - Viernes: 9:00 - 18:00</p>
        <p>Sábado: 10:00 - 16:00</p>
        <p>Domingo: Cerrado</p>
      </div>
      <div class="socials">
        <h4>Síguenos</h4>
        <div class="social-icons">
          <a href="#"><i class="fab fa-facebook"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
          <a href="#"><i class="fab fa-tiktok"></i></a>
          <a href="#"><i class="fab fa-x-twitter"></i></a>
        </div>
      </div>
    </div>
    <p class="copyright">© 2025 Joyería Elegance - Todos los derechos reservados</p>
  </footer>
</body>
</html>
